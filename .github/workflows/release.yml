name: Multi-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: ferric.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: ferric
            archive_ext: tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: ferric
            archive_ext: tar.gz
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: ferric
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: ferric
            archive_ext: tar.gz

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p agent-cli --bin ferric
          else
            cargo build --release --target ${{ matrix.target }} -p agent-cli --bin ferric
          fi
        shell: bash

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          STAGING="ferric-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/ferric" "$STAGING/${{ matrix.bin_name }}"
          cp README.md LICENSE "$STAGING/" 2>/dev/null || true
          tar -czvf "$STAGING.tar.gz" -C "$STAGING" .
          echo "ASSET=$STAGING.tar.gz" >> $GITHUB_ENV
        shell: bash

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        run: |
          $STAGING = "ferric-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $STAGING -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ferric.exe" -Destination "$STAGING\ferric.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/ferric.exe" -Destination "$STAGING\agent.exe" -Force
          Compress-Archive -Path "$STAGING\*" -DestinationPath "$STAGING.zip" -Force
          echo "ASSET=$STAGING.zip" >> $env:GITHUB_ENV

      - name: Generate SHA-256 Checksum
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash > "$($env:ASSET).sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
        shell: bash

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
